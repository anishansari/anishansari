<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 4 · Android Activity — Interactive Lecture</title>
<meta name="description" content="Android Activity lifecycle, multiple activities, intents, extras, results and layout data — interactive lecture deck.">
<style>
:root{
  --bg:#0f1115;
  --panel:#171a21;
  --ink:#f2f4f8;
  --muted:#9aa4b2;
  --accent:#4ade80;
  --accent2:#60a5fa;
  --warn:#fbbf24;
  --danger:#f87171;
  --line:#2a2f3a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;
}
#deck{position:relative;width:100vw;height:100vh}
.slide{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  justify-content:flex-start;
  padding:4.5vh 7vw 11vh;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  animation:fade .35s ease;
}
.slide.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

h1{font-size:clamp(32px,5.2vw,68px);line-height:1.08;letter-spacing:-.02em;font-weight:800}
h2{font-size:clamp(24px,3.4vw,44px);line-height:1.15;letter-spacing:-.015em;font-weight:750;margin-bottom:.55em}
h2 .num{color:var(--accent);font-weight:600;margin-right:.35em}
h3{font-size:clamp(16px,1.6vw,22px);font-weight:650;color:var(--accent2);margin-bottom:.5em}
p.lead{font-size:clamp(16px,1.9vw,26px);color:var(--muted);line-height:1.5;max-width:56ch}
.kicker{
  font-size:clamp(11px,1.05vw,14px);
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:1.1em;
}
ul{list-style:none;display:flex;flex-direction:column;gap:.75em;max-width:66ch}
ul li{
  font-size:clamp(15px,1.75vw,24px);line-height:1.4;
  padding-left:1.5em;position:relative;color:#dfe4ec;
}
ul li::before{
  content:"";position:absolute;left:0;top:.62em;
  width:.5em;height:.5em;border-radius:50%;background:var(--accent);
}
ul li b,ul li strong{color:#fff;font-weight:700}
ul.tight li{font-size:clamp(14px,1.5vw,20px)}
ul.tight{gap:.55em}

.two{display:grid;grid-template-columns:1fr 1fr;gap:2.6vw;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:1.5em 1.4em;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.card:hover{
  transform:translateY(-3px);
  border-color:#3d4658;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.card h3{margin-bottom:.4em}
.card p{font-size:clamp(13px,1.35vw,18px);color:var(--muted);line-height:1.45}
.icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:2em;height:2em;border-radius:50%;
  background:#1e2230;border:1px solid var(--line);
  font-size:clamp(14px,1.4vw,20px);margin-bottom:.55em;
}

table{width:100%;border-collapse:collapse;font-size:clamp(12px,1.4vw,19px)}
th,td{text-align:left;padding:.68em .7em;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--accent);font-weight:700;font-size:.92em;letter-spacing:.03em;text-transform:uppercase}
td strong{color:#fff}
td.dim{color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw;margin-top:1.4em}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.2em 1em}
.stat .v{font-size:clamp(20px,2.9vw,40px);font-weight:800;color:var(--accent);line-height:1.05}
.stat .l{font-size:clamp(11px,1.15vw,15px);color:var(--muted);margin-top:.5em;line-height:1.35}

.bars{display:flex;flex-direction:column;gap:1.05em;margin-top:.6em}
.bar-row{display:grid;grid-template-columns:15ch 1fr auto;gap:1em;align-items:center}
.bar-row .name{font-size:clamp(12px,1.35vw,18px);color:#dfe4ec}
.track{height:clamp(16px,2.2vh,26px);background:#1e2230;border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#22c55e,#4ade80);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.fill.blue{background:linear-gradient(90deg,#2563eb,#60a5fa)}
@keyframes grow{from{width:0 !important}}
.bar-row .val{font-size:clamp(12px,1.4vw,19px);font-weight:700;color:#fff;min-width:9ch;text-align:right}

.chain{display:flex;align-items:center;gap:.5vw;flex-wrap:wrap;margin:.4em 0 1em}
.node{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.65em .9em;font-size:clamp(11px,1.15vw,16px)}
.node.bad{border-color:#7f1d1d;color:#fca5a5}
.node.good{border-color:#14532d;color:#86efac}
.arrow{color:var(--muted);font-size:clamp(13px,1.3vw,18px)}

.pill{display:inline-block;background:#1e2230;border:1px solid var(--line);border-radius:999px;padding:.35em .85em;font-size:clamp(11px,1.15vw,15px);color:var(--muted);margin:.2em .3em .2em 0;cursor:default}
.pill[data-goto]{cursor:pointer}
.pill[data-goto]:hover{border-color:var(--accent);color:#86efac}
.pill.g{border-color:#14532d;color:#86efac}
.pill.r{border-color:#7f1d1d;color:#fca5a5}

.venn{display:flex;flex-direction:column;gap:0;align-items:flex-start;margin-top:.4em}
.ring{border:2px solid;border-radius:12px;padding:1.1em 1.3em;width:100%}
.ring .t{font-weight:750;font-size:clamp(14px,1.6vw,22px)}
.ring .d{font-size:clamp(11px,1.2vw,16px);color:var(--muted);margin-top:.25em}
.r1{border-color:#60a5fa}
.r2{border-color:#4ade80;margin-left:2.2em;margin-top:-.5em;width:calc(100% - 2.2em)}
.r3{border-color:#fbbf24;margin-left:4.4em;margin-top:-.5em;width:calc(100% - 4.4em)}

.callout{
  border-left:4px solid var(--warn);background:#1c1a12;
  padding:1em 1.2em;border-radius:0 10px 10px 0;
  font-size:clamp(13px,1.45vw,20px);line-height:1.45;color:#f5e9c8;margin-top:1em;
}
.callout.red{border-color:var(--danger);background:#1e1414;color:#fbd5d5}
.callout b{color:#fff}

.example{
  border-left:4px solid #22c55e;background:#0f1a14;
  padding:.85em 1.1em;border-radius:0 10px 10px 0;
  font-size:clamp(12px,1.3vw,17px);line-height:1.45;color:#b7e4c7;margin-top:.9em;
}
.example .ex-label{
  display:block;font-size:.78em;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-weight:750;margin-bottom:.35em;
}
.example b{color:#fff}

.benefit{margin-bottom:.15em}
.benefit .so{
  display:block;font-size:clamp(12px,1.25vw,16px);color:var(--muted);
  margin-top:.2em;padding-left:0;font-weight:400;
}

.reveal{
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:1em 1.15em;cursor:pointer;
  transition:border-color .2s ease,transform .15s ease;
  outline:none;
}
.reveal:hover,.reveal:focus{border-color:var(--accent2);transform:translateY(-2px)}
.reveal .reveal-q{
  font-size:clamp(13px,1.4vw,18px);font-weight:650;color:#e8ecf2;
  display:flex;justify-content:space-between;align-items:center;gap:.8em;
}
.reveal .hint{font-size:.85em;color:var(--muted);font-weight:500;white-space:nowrap}
.reveal-body{
  display:none;margin-top:.75em;padding-top:.75em;border-top:1px solid var(--line);
  font-size:clamp(12px,1.3vw,17px);color:var(--muted);line-height:1.45;
}
.reveal.open .reveal-body{display:block}
.reveal.open .hint{color:var(--accent)}

.quiz{max-width:52ch}
.quiz .q{
  font-size:clamp(18px,2.4vw,32px);font-weight:750;line-height:1.25;
  margin-bottom:1.1em;letter-spacing:-.01em;
}
.quiz button{
  display:block;width:100%;text-align:left;
  background:var(--panel);color:#dfe4ec;border:1px solid var(--line);
  border-radius:12px;padding:.9em 1.1em;margin-bottom:.65em;
  font-size:clamp(14px,1.45vw,19px);cursor:pointer;
  font-family:inherit;transition:border-color .15s,background .15s,transform .15s;
}
.quiz button:hover:not(:disabled){border-color:var(--accent2);transform:translateX(3px)}
.quiz button.correct{border-color:#14532d;background:#0f1f15;color:#86efac}
.quiz button.wrong{border-color:#7f1d1d;background:#1e1414;color:#fca5a5}
.quiz button:disabled{cursor:default;opacity:.95}
.quiz .explain{
  display:none;margin-top:.6em;font-size:clamp(12px,1.3vw,17px);
  color:var(--muted);line-height:1.45;padding:.8em 1em;
  background:#1c1a12;border-radius:10px;border-left:3px solid var(--warn);
}
.quiz.answered .explain{display:block}

.viz, svg.viz{
  width:100%;max-height:38vh;display:block;object-fit:contain;border-radius:12px;
  border:1px solid var(--line);background:#0a0c10;
}
.viz-wrap{margin:.55em 0 .85em;max-width:100%}
.viz-wrap.compact svg.viz,.viz-wrap.compact .viz{max-height:22vh}
.slide .two.viz-split{align-items:center}
.checklist-strip{
  display:flex;flex-wrap:wrap;gap:.45em;margin:.5em 0 1em;
}
.checklist-strip span{
  display:inline-flex;align-items:center;gap:.35em;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:.35em .75em;font-size:clamp(11px,1.1vw,14px);color:var(--muted);
}
.checklist-strip span b{color:var(--accent);font-weight:800}


.card .prob{
  font-size:clamp(12px,1.3vw,17px);color:var(--muted);line-height:1.45;
}
.card .sol{
  margin-top:.9em;padding-top:.85em;border-top:1px solid var(--line);
  font-size:clamp(12px,1.32vw,17px);line-height:1.45;color:#c9f5d8;
}
.card .sol .tag{
  display:block;font-size:.82em;letter-spacing:.11em;text-transform:uppercase;
  color:var(--accent);font-weight:750;margin-bottom:.4em;
}
.card .sol b{color:#fff}
.card .lbl{
  display:block;font-size:.8em;letter-spacing:.11em;text-transform:uppercase;
  color:#7a8494;font-weight:700;margin-bottom:.4em;
}
.unitnote{
  font-size:clamp(11px,1.12vw,15px);color:#7a8494;margin-top:1.1em;line-height:1.5;
}
.unitnote b{color:#c3cbd6}

.big-q{font-size:clamp(26px,4.4vw,58px);font-weight:800;line-height:1.15;letter-spacing:-.02em;max-width:22ch}
.big-q em{color:var(--accent);font-style:normal}

footer{
  position:absolute;left:0;right:0;bottom:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 7vw 2.4vh;font-size:12px;color:#5b6472;
}
#bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .3s ease;z-index:5}
.nav{position:fixed;right:2vw;bottom:2vh;display:flex;gap:8px;z-index:10}
.nav button{
  background:var(--panel);color:var(--muted);border:1px solid var(--line);
  width:38px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
}
.nav button:hover{color:#fff;border-color:var(--accent)}
.src{font-size:clamp(10px,1.02vw,13px);color:#5b6472;margin-top:1.2em;line-height:1.5}
@media (max-width:900px){
  .two,.three{grid-template-columns:1fr;gap:1.2em}
  .concept-grid{grid-template-columns:1fr !important}
}
@media (max-width:760px){
  .two,.three{grid-template-columns:1fr;gap:1.2em}
  .stats{grid-template-columns:repeat(2,1fr)}
  .bar-row{grid-template-columns:11ch 1fr;}
  .bar-row .val{grid-column:2;text-align:left}
}

.icon-row{
  display:flex;flex-wrap:wrap;gap:.55em;margin-top:1em;
}
.icon-chip{
  display:inline-flex;align-items:center;gap:.45em;
  background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:.45em .95em;
  font-size:clamp(12px,1.25vw,16px);color:#dfe4ec;
  cursor:pointer;user-select:none;outline:none;
  transition:border-color .15s,background .15s,transform .15s;
}
.icon-chip:hover,.icon-chip:focus{border-color:var(--accent2);transform:translateY(-1px)}
.icon-chip.active{
  border-color:var(--accent);background:#0f1f15;color:#86efac;
}
.icon-chip .ic{font-size:1.15em;line-height:1}
.tip-panel{
  margin-top:.85em;min-height:2.6em;
  padding:.75em 1em;border-radius:10px;
  background:#12151c;border:1px dashed var(--line);
  font-size:clamp(12px,1.3vw,17px);color:var(--muted);line-height:1.45;
}
.tip-panel b{color:#fff}
.tip-panel:empty{display:none}
.tip-panel.has-tip{border-style:solid;border-color:#2d3a2d;background:#0f1a14;color:#b7e4c7}

.tap-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(16ch,1fr));
  gap:.85em;margin-top:.9em;
}
.tap{
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:1em 1.05em;cursor:pointer;
  outline:none;min-height:5.5em;
  transition:border-color .15s,transform .15s;
  position:relative;
}
.tap:hover,.tap:focus{border-color:var(--accent2);transform:translateY(-2px)}
.tap-front{
  font-size:clamp(13px,1.4vw,18px);font-weight:650;color:#e8ecf2;
  display:flex;justify-content:space-between;align-items:flex-start;gap:.5em;
}
.tap-front .hint{font-size:.78em;color:var(--muted);font-weight:500;white-space:nowrap}
.tap-back{
  display:none;margin-top:.7em;padding-top:.7em;border-top:1px solid var(--line);
  font-size:clamp(12px,1.25vw,16px);color:var(--muted);line-height:1.45;
}
.tap.open{border-color:var(--accent)}
.tap.open .tap-back{display:block}
.tap.open .hint{color:var(--accent)}
.tap[data-goto]{cursor:pointer}

.confetti{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.35;
}
.confetti i{
  position:absolute;width:8px;height:8px;border-radius:2px;
  animation:fall 6s linear infinite;
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg);opacity:0}
  10%{opacity:1}
  100%{transform:translateY(110vh) rotate(360deg);opacity:.2}
}


/* --- Progress / fullscreen / replayable motion (no content changes) --- */
.nav{
  position:fixed;right:2vw;bottom:2vh;display:flex;gap:8px;z-index:10;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:70vw;
}
.nav button{
  background:var(--panel);color:var(--muted);border:1px solid var(--line);
  min-width:38px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
  padding:0 .65em;font-family:inherit;
}
.nav button:hover{color:#fff;border-color:var(--accent)}
.nav button.wide{font-size:12px;font-weight:650;color:#dfe4ec}
.progress-toast{
  position:fixed;left:2vw;bottom:2.2vh;z-index:10;
  background:#0f1a14;border:1px solid #14532d;color:#86efac;
  border-radius:999px;padding:.35em .85em;font-size:12px;
  opacity:0;pointer-events:none;transition:opacity .35s;
}
.progress-toast.show{opacity:1}

/* Staggered entrance for existing .chain .node */
.chain.dm-anim .node{opacity:0;transform:translateY(14px)}
.chain.dm-anim.playing .node{
  animation:dmBuildIn .65s cubic-bezier(.2,.8,.2,1) forwards;
}
.chain.dm-anim.playing .node:nth-child(1){animation-delay:.05s}
.chain.dm-anim.playing .node:nth-child(2){animation-delay:.18s}
.chain.dm-anim.playing .node:nth-child(3){animation-delay:.32s}
.chain.dm-anim.playing .node:nth-child(4){animation-delay:.46s}
.chain.dm-anim.playing .node:nth-child(5){animation-delay:.60s}
.chain.dm-anim.playing .node:nth-child(6){animation-delay:.74s}
.chain.dm-anim.playing .arrow{animation:dmBuildIn .4s ease forwards;animation-delay:.2s;opacity:0}
@keyframes dmBuildIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* List/card stagger REMOVED — motion stays on diagrams & playgrounds only */

.slide.active .fill{animation:grow 1s cubic-bezier(.2,.8,.2,1) both}



/* === Concept teaching block === */
.concept{margin:.45em 0 .85em;max-width:100%;width:100%}
.concept-grid{display:grid;grid-template-columns:1fr;gap:.4em;width:100%;max-width:100%}
@media (min-width:1100px){.concept-grid{grid-template-columns:1fr 1fr;gap:.45em}}
.concept-row{
  display:block;width:100%;max-width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:.55em .75em;cursor:pointer;outline:none;text-align:left;
  font-family:inherit;color:inherit;transition:border-color .15s,background .15s;
  overflow:visible;height:auto;
}
.concept-row:hover,.concept-row:focus{border-color:var(--accent2)}
.concept-row.open{border-color:var(--accent);background:#0f1a14}
.concept-q{
  display:flex;align-items:center;gap:.55em;
  font-size:clamp(12px,1.25vw,16px);font-weight:650;color:#e8ecf2;
}
.cq-n{
  display:inline-flex;align-items:center;justify-content:center;
  width:1.55em;height:1.55em;border-radius:50%;flex-shrink:0;
  background:#1e2230;border:1px solid var(--line);
  font-size:.85em;color:var(--accent);font-weight:800;
}
.concept-row.open .cq-n{background:#14532d;border-color:#22c55e;color:#86efac}
.concept-a{
  display:none;margin-top:.45em;padding-top:.45em;border-top:1px solid var(--line);
  font-size:clamp(13px,1.35vw,18px);line-height:1.45;color:#dfe4ec;
  max-height:none;overflow:visible;
}
.concept-row.open .concept-a{display:block}
.concept-a b{color:#fff}
.concept-a .tight{margin:.35em 0 0;padding-left:1.15em}
.concept-a .tight li{margin:.15em 0}
.concept-tools{display:flex;gap:.5em;margin-bottom:.55em;flex-wrap:wrap}
.concept-tools button{
  background:#1e2230;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:.3em .85em;font-size:clamp(11px,1.05vw,13px);
  cursor:pointer;font-family:inherit;
}
.concept-tools button:hover{border-color:var(--accent);color:#86efac}

/* Compact always-visible cards variant */
.concept-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.55em;margin:.5em 0 1em}
@media (max-width:900px){.concept-cards{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.concept-cards{grid-template-columns:1fr}}
.concept-card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.75em .85em;
}
.concept-card .cq-label{
  font-size:clamp(10px,1vw,12px);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);font-weight:750;margin-bottom:.35em;display:flex;align-items:center;gap:.4em;
}
.concept-card p{font-size:clamp(11px,1.15vw,15px);color:var(--muted);line-height:1.4}
.concept-card p b{color:#fff}



/* discuss */
.discuss{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.2em 1.3em}
.discuss .badge{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:.5em}
.discuss .prompt{font-size:clamp(18px,2.2vw,30px);font-weight:750;line-height:1.25}
.discuss .hint-line{margin-top:.7em;font-size:clamp(12px,1.25vw,16px);color:var(--muted)}
/* Unit 3 extras */
.svg-box{background:#0a0c10;border:1px solid var(--line);border-radius:14px;padding:.8em;margin-top:.6em;overflow:auto}
.svg-box svg{display:block;width:100%;height:auto;max-height:34vh}
.phone-frame{background:#0a0c10;border:2px solid #3d4658;border-radius:22px;padding:12px 10px;max-width:220px;margin:.4em auto;box-shadow:inset 0 0 0 2px #1e2230}
.phone-frame .status{height:10px;display:flex;justify-content:center;margin-bottom:6px}
.phone-frame .status i{display:block;width:36%;height:4px;border-radius:4px;background:#3d4658}
.phone-frame .appbar{background:#1e3a5f;color:#dbeafe;border-radius:6px 6px 0 0;padding:.45em .6em;font-size:12px;font-weight:700}
.phone-frame .body{background:#12151c;border-radius:0 0 6px 6px;padding:.7em .65em;min-height:120px;font-size:12px;color:#dfe4ec}
.attr-table{font-size:clamp(11px,1.2vw,15px)}
.attr-table td:first-child{color:#86efac;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
pre.code{background:#0a0c10;border:1px solid var(--line);border-radius:10px;padding:1em;overflow:auto;max-height:32vh;font-size:clamp(11px,1.1vw,15px);color:#c9f5d8;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.45;margin-top:.7em;white-space:pre}
@media (max-width:900px){
  .concept-grid{grid-template-columns:1fr !important}
}


/* === Interactive class enhancers (Unit 3) === */
/* Only diagrams / phone frames fade in — not concept lists or cards */
.dm-motion .svg-box,
.dm-motion .phone-frame,
.dm-motion .play-phone,
.dm-motion .teach-stage,
.dm-motion .cl-stage,
.dm-motion .abs-stage,
.dm-motion .tbl-stage,
.dm-motion .rel-stage{
  opacity:0;transform:translateY(10px);
}
.dm-motion.playing .svg-box,
.dm-motion.playing .phone-frame,
.dm-motion.playing .play-phone,
.dm-motion.playing .teach-stage,
.dm-motion.playing .cl-stage,
.dm-motion.playing .abs-stage,
.dm-motion.playing .tbl-stage,
.dm-motion.playing .rel-stage{
  animation:dmBuildIn .55s cubic-bezier(.2,.8,.2,1) forwards;
}

.pulse-label{
  display:inline-block;animation:softPulse 1.8s ease-in-out infinite;
}
@keyframes so
